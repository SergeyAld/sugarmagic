<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Галерия • Sugar Magic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --pink: #FFD1DC;
            --blue: #AEC6CF;
            --yellow: #FFF9A6;
            --ink: #3d2b2d;
            --ink-soft: #6f6064;
            --shadow: 0 18px 45px rgba(61, 43, 45, 0.16);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(255, 209, 220, 0.86), transparent 22%),
                radial-gradient(circle at 85% 10%, rgba(174, 198, 207, 0.82), transparent 20%),
                linear-gradient(135deg, var(--yellow) 0%, var(--pink) 48%, var(--blue) 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .page-shell {
            max-width: 1240px;
            margin: 0 auto;
            padding: 22px 18px 70px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 26px;
            padding: 14px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .76);
            box-shadow: var(--shadow);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .brand img {
            width: 54px;
            height: 54px;
            object-fit: contain;
            border-radius: 50%;
        }

        .brand strong {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
        }

        .brand span {
            font-size: .8rem;
            color: var(--ink-soft);
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .btn {
            text-decoration: none;
            color: var(--ink);
            font-weight: 700;
            font-size: .92rem;
            padding: 10px 16px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--pink), var(--yellow));
            box-shadow: 0 8px 18px rgba(61, 43, 45, .12);
            transition: transform .2s ease;
        }

        .btn:hover { transform: translateY(-1px); }

        .head {
            text-align: center;
            margin: 10px 0 26px;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(174, 198, 207, .5);
            color: #47606a;
            font-weight: 700;
            font-size: .77rem;
            text-transform: uppercase;
            letter-spacing: .16em;
        }

        .head h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.9rem, 4vw, 2.8rem);
            margin: 0 0 8px;
        }

        .head p {
            margin: 0;
            color: var(--ink-soft);
        }

        .grid {
            columns: 4 240px;
            column-gap: 14px;
        }

        .item {
            display: block;
            break-inside: avoid;
            margin-bottom: 14px;
            border-radius: 22px;
            overflow: hidden;
            background: rgba(255, 255, 255, .7);
            box-shadow: var(--shadow);
            cursor: zoom-in;
            border: none;
            padding: 0;
            width: 100%;
        }

        .item img {
            display: block;
            width: 100%;
            height: auto;
            transition: transform .35s ease;
        }

        .item:hover img { transform: scale(1.04); }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(30, 20, 22, .92);
        }

        .lightbox.open { display: flex; }

        .lightbox img {
            max-width: 92vw;
            max-height: 86vh;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }

        .lb-btn {
            position: absolute;
            border: none;
            cursor: pointer;
            color: #fff;
            background: rgba(255, 255, 255, .18);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 1.6rem;
            line-height: 1;
        }

        .lb-btn:hover { background: rgba(255, 255, 255, .32); }
        .lb-close { top: 18px; right: 18px; }
        .lb-prev { left: 14px; top: 50%; transform: translateY(-50%); }
        .lb-next { right: 14px; top: 50%; transform: translateY(-50%); }

        .lb-count {
            position: absolute;
            bottom: 16px;
            left: 0;
            right: 0;
            text-align: center;
            color: #fff;
            font-size: .9rem;
            opacity: .85;
        }

        @media (max-width: 640px) {
            .topbar { border-radius: 24px; }
            .grid { columns: 2 140px; column-gap: 10px; }
            .item { margin-bottom: 10px; border-radius: 16px; }
        }
    </style>
</head>

<body>
    <div class="page-shell">
        <header class="topbar">
            <a class="brand" href="index.html">
                <img src="logo.jpg" alt="Sugar Magic logo" />
                <div>
                    <strong>Sugar Magic</strong>
                    <span>Boutique Desserts</span>
                </div>
            </a>
            <a class="btn" href="index.html">← Начало</a>
        </header>

        <div class="head">
            <span class="eyebrow">Галерия</span>
            <h1>Всички наши сладки творения</h1>
            <p>Натиснете върху снимка, за да я видите по-голяма.</p>
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <div class="lightbox" id="lightbox" aria-hidden="true">
        <button class="lb-btn lb-close" id="lbClose" aria-label="Затвори">×</button>
        <button class="lb-btn lb-prev" id="lbPrev" aria-label="Предишна">‹</button>
        <img id="lbImg" alt="" />
        <button class="lb-btn lb-next" id="lbNext" aria-label="Следваща">›</button>
        <div class="lb-count" id="lbCount"></div>
    </div>

    <script>
        const TOTAL = 64;
        const grid = document.getElementById('grid');
        const lightbox = document.getElementById('lightbox');
        const lbImg = document.getElementById('lbImg');
        const lbCount = document.getElementById('lbCount');

        let failed = 0;
        let files = [];   // успешно заредени снимки
        let current = 0;

        function show(i) {
            current = (i + files.length) % files.length;
            lbImg.src = files[current];
            lbCount.textContent = (current + 1) + ' / ' + files.length;
        }

        function openBox(i) {
            show(i);
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closeBox() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        for (let n = 1; n <= TOTAL; n++) {
            const file = n + '.jpg';
            const btn = document.createElement('button');
            btn.className = 'item';
            btn.type = 'button';

            const img = document.createElement('img');
            img.src = file;
            img.alt = 'Sugar Magic ' + n;
            
            img.addEventListener('load', () => {
                files.push(file);
                files.sort((a, b) => parseInt(a) - parseInt(b));
                btn.onclick = () => openBox(files.indexOf(file));
            });
            img.addEventListener('error', () => { btn.remove(); failed++; if (failed === TOTAL) grid.innerHTML = '<p style="text-align:center">Снимките не се намират. Сложете gallery.html в същата папка като 1.jpg, 2.jpg …</p>'; });

            btn.appendChild(img);
            grid.appendChild(btn);
        }

        document.getElementById('lbClose').onclick = closeBox;
        document.getElementById('lbPrev').onclick = () => show(current - 1);
        document.getElementById('lbNext').onclick = () => show(current + 1);
        lightbox.addEventListener('click', e => { if (e.target === lightbox) closeBox(); });

        document.addEventListener('keydown', e => {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'Escape') closeBox();
            if (e.key === 'ArrowLeft') show(current - 1);
            if (e.key === 'ArrowRight') show(current + 1);
        });

        // Swipe за телефон
        let startX = 0;
        lightbox.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
        lightbox.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - startX;
            if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
        });
    </script>
</body>

</html>
